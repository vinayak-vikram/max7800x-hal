[project]
name = "max7800x-cnn-tools"
version = "0.1.0"
description = "Network generators for the max7800x-hal CNN module"
requires-python = ">=3.11,<3.12"

# ai8x-synthesis pins every one of these, and the pins are load-bearing: numpy 2
# makes izer drop the kernel table without failing, and torch 2.6 refuses to
# load the checkpoints. Kept in step with its requirements.txt, minus what izer
# never imports. yamllint is a linter izer shells out to by name.
dependencies = [
    "GitPython==3.1.43",
    "PyGithub==2.3.0",
    "PyYAML==6.0.1",
    "numpy==1.26.4",
    "onnx==1.16.1",
    "rich==13.7.1",
    "torch==2.3.1",
    "xxhash==3.4.1",
    "yamllint==1.35.1",
]

[tool.uv]
package = false
